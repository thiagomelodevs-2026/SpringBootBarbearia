<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro de cliente</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-dark-900">
<nav th:replace="~{layout/fragments/header :: header}"></nav>
<main class="container py-5">
    <div class="card card-glass border-0 shadow-lg mx-auto" style="max-width: 720px">
        <div class="card-body p-4">
            <h1 class="h3 mb-2">Cadastre-se</h1>
            <p class="text-light-emphasis mb-4">Preencha seus dados para criar seu cadastro.</p>
            <form class="row g-3" data-auth-form>
                <div class="col-md-6">
                    <label class="form-label" for="cadastro-nome">Nome completo</label>
                    <input class="form-control" id="cadastro-nome" name="nome" type="text" autocomplete="name" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="cadastro-email">E-mail</label>
                    <input class="form-control" id="cadastro-email" name="email" type="email" autocomplete="email" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="cadastro-telefone">Telefone</label>
                    <input class="form-control" id="cadastro-telefone" name="telefone" type="tel" autocomplete="tel" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="cadastro-senha">Senha</label>
                    <input class="form-control" id="cadastro-senha" name="senha" type="password" autocomplete="new-password" required>
                </div>
                <div class="col-12">
                    <button class="btn btn-accent" type="submit">Criar cadastro</button>
                    <p class="small mt-3 mb-0" data-form-message role="status" aria-live="polite"></p>
                </div>
            </form>
        </div>
    </div>
</main>
<footer th:replace="~{layout/fragments/footer :: footer}"></footer>
<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
