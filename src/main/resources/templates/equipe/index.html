<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nossa equipe</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-dark-900">
<nav th:replace="~{layout/fragments/header :: header}"></nav>
<main class="container py-5">
    <h1 class="h3 mb-4">Nossa equipe</h1>
    <div class="row g-4">
        <div class="col-md-4" th:each="barbeiro : ${barbeiros}">
            <div class="card card-glass h-100"><div class="card-body text-center">
                <img th:if="${barbeiro.foto != null}" th:src="${barbeiro.foto}" class="rounded-circle mb-3" style="width:120px;height:120px;object-fit:cover" alt="Foto do barbeiro">
                <div th:if="${barbeiro.foto == null}" class="display-5 mb-3">✂️</div>
                <h2 class="h5" th:text="${barbeiro.nome}"></h2>
                <a class="btn btn-accent mt-2" th:href="@{/agendar}">Agendar</a>
            </div></div>
        </div>
        <div class="col-12" th:if="${#lists.isEmpty(barbeiros)}"><p class="text-light-emphasis">Nenhum barbeiro cadastrado no banco de dados.</p></div>
    </div>
</main>
<footer th:replace="~{layout/fragments/footer :: footer}"></footer>
<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
