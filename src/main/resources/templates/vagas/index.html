<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trabalhe conosco</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-dark-900">
<nav th:replace="~{layout/fragments/header :: header}"></nav>
<main class="container py-5">
    <div class="card card-glass shadow-lg"><div class="card-body p-4">
        <h1 class="h3 mb-3">Trabalhe conosco</h1>
        <p>Envie seu contato para participar do processo de seleção da barbearia.</p>
        <form class="row g-3">
            <div class="col-md-6"><label class="form-label" for="nome">Nome</label><input class="form-control" id="nome" name="nome" required></div>
            <div class="col-md-6"><label class="form-label" for="email">E-mail</label><input class="form-control" id="email" name="email" type="email" required></div>
            <div class="col-12"><label class="form-label" for="mensagem">Mensagem</label><textarea class="form-control" id="mensagem" name="mensagem" rows="4" required></textarea></div>
            <div class="col-12"><button class="btn btn-accent" type="submit">Enviar</button></div>
        </form>
    </div></div>
</main>
<footer th:replace="~{layout/fragments/footer :: footer}"></footer>
<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
