# O endere�o, o usu�rio e a senha N�O moram aqui: este arquivo vai para o
# GitHub, e a senha n�o pode ir junto. Eles ficam no .env, na raiz do projeto,
# que o .gitignore deixa de fora. Esta linha manda o Spring ler o .env como se
# fosse mais um application.properties. Modelo: o .env.example.

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.password=${DB_PASSWORD}

# Poucas conex�es por pessoa. O padr�o abre 10, e o plano gratuito do Supabase
# aceita poucas ao mesmo tempo: com a equipe inteira rodando, faltaria.
spring.datasource.hikari.maximum-pool-size=3

# update: cria a tabela que falta e a coluna que falta, e nunca apaga nada. � o
# que deixa o dado vivo de uma subida para a outra. Ele n�o sabe renomear nem
# trocar o tipo de uma coluna: quando precisar, a aula diz como.
spring.jpa.hibernate.ddl-auto=update

# O SQL que o Hibernate escreve por voc�, no log. Formatado, para dar para ler.

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# A carga inicial. Num banco que n�o � de mem�ria, o Spring s� roda os .sql se
# algu�m mandar: always. E roda DEPOIS de o Hibernate criar as tabelas. Como ela
# roda a cada subida, cada arquivo s� insere o que ainda n�o est� l�.
spring.sql.init.mode=never

spring.jpa.defer-datasource-initialization=true

